<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>🔒 Admin - Versátil</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            background: white;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .login-container h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: #333;
            font-size: 1.8rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #555;
            font-size: 0.9rem;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #e5e5e5;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn-login {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .error-message {
            background: #fee;
            color: #c33;
            padding: 0.8rem;
            border-radius: 8px;
            margin-top: 1rem;
            display: none;
            text-align: center;
            font-size: 0.9rem;
        }
        
        .admin-dashboard {
            display: none;
            background: white;
            width: 95vw;
            height: 95vh;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .admin-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .admin-header h2 {
            font-size: 1.3rem;
        }
        
        .btn-logout {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 0.6rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        .btn-logout:hover {

        }
        
        .admin-body {
            display: flex;
            height: calc(100% - 80px);
        }
        
        .admin-sidebar {
            width: 250px;
            background: #f8f9fa;
            padding: 2rem 0;
            border-right: 1px solid #e5e5e5;

        .sidebar-item {
            padding: 1rem 2rem;

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));

            background: white;

            width: 100%;

            border-radius: 12px;

            box-shadow: 0 2px 8px rgba(0,0,0,0.1);

            padding: 1rem;

            font-weight: 600;

            border-bottom: 2px solid #e5e5e5;

            text-transform: uppercase;

        .product-img {

            height: 80px;

            background-position: center;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);

        .stock-badge {
            display: inline-block;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;

        .stock-ok { background: #d4edda; color: #155724; }
        .stock-low { background: #fff3cd; color: #856404; }
        .stock-out { background: #f8d7da; color: #721c24; }
        
        .btn-action {
            padding: 0.5rem 1rem;

            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            margin-right: 0.5rem;
            font-size: 0.85rem;

        .btn-stock {
            background: #17a2b8;
            color: white;
        }
        
        .btn-stock:hover {
            background: #138496;

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #e5e5e5;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: #999;
            transition: color 0.3s;
        }
        
        .modal-close:hover {
            color: #333;
        }
        
        .variants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }
        
        .variant-card {
            background: #f8f9fa;
            padding: 1.2rem;
            border-radius: 8px;
            border: 2px solid #e5e5e5;
            transition: all 0.3s;
        }
        
        .variant-card:hover {
            border-color: #667eea;
        }
        
        .variant-card.unavailable {
            opacity: 0.6;
            border-color: #dc3545;
        }
        
        .variant-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .variant-label {
            font-weight: 700;
            color: #333;
            font-size: 1rem;
        }
        
        .stock-input {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 0.8rem;
            font-size: 1rem;
            font-weight: 600;
        }
        
        .stock-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .toggle-available {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            cursor: pointer;
            user-select: none;
        }
        
        .toggle-available input {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }
        
        .btn-save {
            background: #28a745;
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            margin-top: 1.5rem;
            width: 100%;
            transition: background 0.3s;
        }
        
        .btn-save:hover {
            background: #218838;
        }
        
        .loading {
            text-align: center;
            padding: 3rem;
            color: #999;
        }
        
        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
    </style>
</head>
<body>
    <div class="login-container" id="loginScreen">
        <h1>🔒 Admin Login</h1>
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>

    <div class="admin-dashboard" id="adminDashboard">
        <div class="admin-header">
            <h2>🛍️ Painel Admin - Versátil</h2>
            <button class="btn-logout" onclick="logout()">Sair</button>
        </div>
        
        <div class="admin-body">
            <div class="admin-sidebar">
                <div class="sidebar-item active" onclick="showSection('dashboard')">
                    📊 Dashboard
                </div>
                <div class="sidebar-item" onclick="showSection('products')">
                    📦 Produtos
                </div>
                <div class="sidebar-item" onclick="showSection('stock')">
                    📋 Estoque Detalhado
                </div>
            </div>
            
            <div class="admin-content">
                <div id="dashboardSection">
                    <h2 style="margin-bottom: 2rem;">Dashboard</h2>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value" id="totalProducts">0</div>
                            <div class="stat-label">Total de Produtos</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="totalStock">0</div>
                            <div class="stat-label">Total em Estoque</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="lowStock">0</div>
                            <div class="stat-label">Estoque Baixo</div>
                        </div>
                        <div class="stat-card">

                <div id="productsSection" style="display: none;">

    <div class="modal" id="stockModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalProductName"></h3>
                <button class="modal-close" onclick="closeStockModal()">×</button>
            </div>
            <div id="variantsContainer"></div>
            <button class="btn-save" onclick="saveStock()">💾 Salvar Alterações</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
  apiKey: "AIzaSyAJ9-qnEhtiRVKiyF2TZcLgVgq5kLZYxSs",
  authDomain: "seja-versatil.firebaseapp.com",
  projectId: "seja-versatil",
  storageBucket: "seja-versatil.firebasestorage.app",
  messagingSenderId: "102339207381",
  appId: "1:102339207381:web:cbe1192e3550cd5bf0825c",
  measurementId: "G-86E5CX4S3T"
};
        
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        
        let currentProduct = null;
        let currentVariants = [];

        function escapeHTML(value) {
            const div = document.createElement('div');
            div.textContent = value == null ? '' : String(value);
            return div.innerHTML;
        }

        function escapeInlineJS(value) {
            return String(value == null ? '' : value)
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/\r?\n/g, ' ');
        }

        function escapeAttribute(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function safeImageUrl(value) {
            const url = String(value || '').trim();
            if (!/^https?:\/\//i.test(url) && !/^data:image\//i.test(url)) return '';
            return escapeHTML(url.replace(/['"\\\r\n]/g, ''));
        }

        const DEFAULT_STOCK_SIZES = ['P', 'M', 'G', 'GG'];
        const COLOR_DISPLAY_ORDER = ['Preto', 'Azul Marinho', 'Cinza', 'Marrom'];

        function normalizeText(value, fallback = '') {
            if (value === null || value === undefined) return fallback;
            const text = String(value).trim();
            return text || fallback;
        }

        function normalizeNumber(value, fallback = 0) {
            const number = Number(value);
            return Number.isFinite(number) ? number : fallback;
        }

        function normalizeKey(value) {
            return normalizeText(value)
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
        }

        function uniqueNormalizedValues(values) {
            const uniqueValues = new Map();

            values.forEach(value => {
                const text = normalizeText(value);
                const key = normalizeKey(text);
                if (text && key && !uniqueValues.has(key)) {
                    uniqueValues.set(key, text);
                }
            });

            return [...uniqueValues.values()];
        }

        function getProductColors(product, variants = []) {
            const colors = Array.isArray(product?.colors) ? product.colors : [];
            const normalizedColors = colors
                .map(color => {
                    if (typeof color === 'string') return normalizeText(color);
                    return normalizeText(color?.name);
                })
                .filter(Boolean);

            const variantColors = variants
                .map(variant => normalizeText(variant.color))
                .filter(Boolean);

            return uniqueNormalizedValues([...normalizedColors, ...variantColors]);
        }

        function getProductSizes(product, variants = []) {
            const sizes = Array.isArray(product?.sizes) ? product.sizes : [];
            const normalizedSizes = sizes.map(size => normalizeText(size)).filter(Boolean);
            const variantSizes = variants.map(variant => normalizeText(variant.size)).filter(Boolean);
            const baseSizes = normalizedSizes.length > 0 ? normalizedSizes : DEFAULT_STOCK_SIZES;
            const sourceSizes = uniqueNormalizedValues([...baseSizes, ...variantSizes]);

            return sourceSizes.length > 0 ? sourceSizes : DEFAULT_STOCK_SIZES;
        }

        function getVariantPairKey(size, color) {
            return `${normalizeKey(size)}__${normalizeKey(color)}`;
        }

        function buildVariantId(size, color) {
            return getVariantPairKey(size, color) || `variant-${Date.now()}`;
        }

        function buildVariantSku(productId, size, color) {
            return [productId, size, color]
                .map(part => normalizeKey(part))
                .filter(Boolean)
                .join('-')
                .toUpperCase();
        }

        async function getProductStockMatrix(productId, product) {
            const variantsSnapshot = await db.collection('produtos').doc(productId).collection('variants').get();
            const variants = [];

            variantsSnapshot.forEach(variantDoc => {
                const data = variantDoc.data() || {};
                variants.push({
                    id: variantDoc.id,
                    ...data,
                    size: normalizeText(data.size),
                    color: normalizeText(data.color),
                    stock: normalizeNumber(data.stock, 0),
                    available: data.available !== false,
                    sku: normalizeText(data.sku)
                });
            });

            const variantsByPair = new Map();
            variants.forEach(variant => {
                if (!variant.size || !variant.color) return;
                variantsByPair.set(getVariantPairKey(variant.size, variant.color), variant);
            });

            const colors = getProductColors(product, variants);
            if (colors.length === 0 && variants.length === 0) return [];

            const sizes = getProductSizes(product, variants);
            const matrix = [];
            const addedPairs = new Set();

            colors.forEach(color => {
                sizes.forEach(size => {
                    const pairKey = getVariantPairKey(size, color);
                    const existingVariant = variantsByPair.get(pairKey);
                    const id = existingVariant?.id || buildVariantId(size, color);

                    matrix.push({
                        id,
                        size,
                        color,
                        stock: normalizeNumber(existingVariant?.stock, 0),
                        available: existingVariant ? existingVariant.available !== false : false,
                        sku: normalizeText(existingVariant?.sku, buildVariantSku(productId, size, color)),
                        price: existingVariant?.price !== undefined ? normalizeNumber(existingVariant.price, product.price || 0) : normalizeNumber(product.price, 0),
                        exists: Boolean(existingVariant)
                    });
                    addedPairs.add(pairKey);
                });
            });

            variants.forEach(variant => {
                const pairKey = getVariantPairKey(variant.size, variant.color);
                if (addedPairs.has(pairKey)) return;

                matrix.push({
                    ...variant,
                    sku: normalizeText(variant.sku, buildVariantSku(productId, variant.size, variant.color)),
                    price: variant.price !== undefined ? normalizeNumber(variant.price, product.price || 0) : normalizeNumber(product.price, 0),
                    exists: true
                });
            });

            return matrix;
        }

        function sortStockVariants(variants) {
            const sizeOrder = DEFAULT_STOCK_SIZES.reduce((acc, size, index) => {
                acc[size] = index;
                return acc;
            }, {});

            return [...variants].sort((a, b) => {
                const colorIndexA = COLOR_DISPLAY_ORDER.indexOf(a.color);
                const colorIndexB = COLOR_DISPLAY_ORDER.indexOf(b.color);

                if (colorIndexA !== -1 && colorIndexB !== -1 && colorIndexA !== colorIndexB) {
                    return colorIndexA - colorIndexB;
                }
                if (colorIndexA !== -1 && colorIndexB === -1) return -1;
                if (colorIndexB !== -1 && colorIndexA === -1) return 1;

                const colorCompare = a.color.localeCompare(b.color, 'pt-BR');
                if (colorCompare !== 0) return colorCompare;

                const sizeCompare = (sizeOrder[a.size] ?? 999) - (sizeOrder[b.size] ?? 999);
                if (sizeCompare !== 0) return sizeCompare;

                return a.size.localeCompare(b.size, 'pt-BR');
            });
        }
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');
            const btn = document.querySelector('.btn-login');
            
            btn.disabled = true;
            btn.textContent = 'Entrando...';
            
            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const adminDoc = await db.collection('admins').doc(userCredential.user.uid).get();
                
                if (!adminDoc.exists || adminDoc.data().role !== 'admin') {
                    await auth.signOut();
                    errorDiv.textContent = '❌ Acesso negado. Você não é administrador.';
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Entrar';
                    return;
                }
                
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'flex';
                loadDashboard();
                
            } catch (error) {
                errorDiv.textContent = '❌ Email ou senha incorretos';
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Entrar';
            }
        });
        
        async function logout() {
            await auth.signOut();
            location.reload();
        }
        
        function showSection(section) {
            document.querySelectorAll('.sidebar-item').forEach(item => item.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('dashboardSection').style.display = 'none';
            document.getElementById('productsSection').style.display = 'none';
            document.getElementById('stockSection').style.display = 'none';
            
            if (section === 'dashboard') {
                document.getElementById('dashboardSection').style.display = 'block';
                loadDashboard();
            } else if (section === 'products') {
                document.getElementById('productsSection').style.display = 'block';
                loadProducts();
            } else if (section === 'stock') {
                document.getElementById('stockSection').style.display = 'block';
                loadStockControl();
            }
        }
        
        async function loadDashboard() {
            try {
                const productsSnapshot = await db.collection('produtos').get();
                let totalStock = 0;
                let lowStock = 0;
                let outOfStock = 0;
                
                for (const doc of productsSnapshot.docs) {
                    const product = doc.data() || {};
                    const variants = await getProductStockMatrix(doc.id, product);
                    
                    variants.forEach(variant => {
                        totalStock += variant.stock || 0;
                        
                        if (variant.stock === 0) {
                            outOfStock++;
                        } else if (variant.stock < 5) {
                            lowStock++;
                        }
                    });
                }
                
                document.getElementById('totalProducts').textContent = productsSnapshot.size;
                document.getElementById('totalStock').textContent = totalStock;
                document.getElementById('lowStock').textContent = lowStock;
                document.getElementById('outOfStock').textContent = outOfStock;
                
            } catch (error) {
                console.error('Erro ao carregar dashboard:', error);
            }
        }
        
        async function loadProducts() {
            const container = document.getElementById('productsTableContainer');
            container.innerHTML = '<div class="loading">⏳ Carregando produtos</div>';
            
            try {
                const productsSnapshot = await db.collection('produtos').get();
                
                let html = `
                    <table class="products-table">
                        <thead>
                            <tr>
                                <th>Imagem</th>
                                <th>Nome</th>
                                <th>Categoria</th>
                                <th>Preço</th>
                                <th>Estoque Total</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                for (const doc of productsSnapshot.docs) {
                    const product = doc.data();
                    const variants = await getProductStockMatrix(doc.id, product);
                    
                    let totalStock = 0;
                    variants.forEach(v => totalStock += v.stock || 0);
                    
                    const stockClass = totalStock === 0 ? 'stock-out' : totalStock < 20 ? 'stock-low' : 'stock-ok';
                    const stockText = totalStock === 0 ? 'SEM ESTOQUE' : totalStock < 20 ? `BAIXO (${totalStock})` : `OK (${totalStock})`;
                    
                    const firstImage = product.images && product.images[0] ? product.images[0] : 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                    const isRealImage = firstImage.startsWith('http') || firstImage.startsWith('data:');
                    const imageUrl = isRealImage ? safeImageUrl(firstImage) : '';
                    const fallbackBackground = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                    const productId = escapeAttribute(escapeInlineJS(doc.id));
                    
                    html += `
                        <tr>
                            <td>
                                <div class="product-img" style="${isRealImage && imageUrl ? `background-image: url('${imageUrl}')` : `background: ${fallbackBackground}`}"></div>
                            </td>
                            <td><strong>${escapeHTML(product.name)}</strong></td>
                            <td>${escapeHTML(product.category)}</td>
                            <td>R$ ${Number(product.price || 0).toFixed(2)}</td>
                            <td><span class="stock-badge ${stockClass}">${stockText}</span></td>
                            <td>
                                <button class="btn-action btn-stock" onclick="openStockModal('${productId}')">📋 Gerenciar</button>
                            </td>
                        </tr>
                    `;
                }
                
                html += `</tbody></table>`;
                container.innerHTML = html;
                
            } catch (error) {
                console.error('Erro ao carregar produtos:', error);
                container.innerHTML = '<div class="loading">❌ Erro ao carregar produtos</div>';
            }
        }
        
        async function loadStockControl() {
            const container = document.getElementById('stockTableContainer');
            container.innerHTML = '<div class="loading">⏳ Carregando estoque</div>';
            
            try {
                const productsSnapshot = await db.collection('produtos').get();
                
                let html = `
                    <table class="products-table">
                        <thead>
                            <tr>
                                <th>Produto</th>
                                <th>Tamanho</th>
                                <th>Cor</th>
                                <th>Estoque</th>
                                <th>Status</th>
                                <th>SKU</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                for (const doc of productsSnapshot.docs) {
                    const product = doc.data();
                    const variants = sortStockVariants(await getProductStockMatrix(doc.id, product));
                    
                    variants.forEach(variant => {
                        const stockClass = variant.stock === 0 ? 'stock-out' : variant.stock < 5 ? 'stock-low' : 'stock-ok';
                        const stockText = variant.stock === 0 ? 'SEM ESTOQUE' : variant.stock < 5 ? 'BAIXO' : 'OK';
                        const syncText = variant.exists ? '' : '<br><small>Pendente de sincronizacao</small>';
                        const availableText = variant.available ? '✅ Disponível' : '❌ Indisponível';
                        
                        html += `
                            <tr>
                                <td><strong>${escapeHTML(product.name)}</strong></td>
                                <td>${escapeHTML(variant.size)}</td>
                                <td>${escapeHTML(variant.color)}</td>
                                <td><strong>${Number(variant.stock || 0)}</strong></td>
                                <td><span class="stock-badge ${stockClass}">${stockText}</span><br><small>${availableText}</small>${syncText}</td>
                                <td><small>${escapeHTML(variant.sku)}</small></td>
                            </tr>
                        `;
                    });
                }
                
                html += `</tbody></table>`;
                container.innerHTML = html;
                
            } catch (error) {
                console.error('Erro ao carregar estoque:', error);
                container.innerHTML = '<div class="loading">❌ Erro ao carregar estoque</div>';
            }
        }
        
        async function openStockModal(productId) {
            try {
                const productDoc = await db.collection('produtos').doc(productId).get();
                const product = productDoc.data();
                
                currentProduct = { id: productId, ...product };
                
                document.getElementById('modalProductName').textContent = product.name;
                
                currentVariants = sortStockVariants(await getProductStockMatrix(productId, product));

                if (currentVariants.length === 0) {
                    document.getElementById('variantsContainer').innerHTML =
                        '<div class="loading">Nenhuma cor ou tamanho cadastrado para este produto</div>';
                    document.getElementById('stockModal').classList.add('active');
                    return;
                }
                
                let html = '<div class="variants-grid">';
                
                const variantsByColor = {};

currentVariants.forEach(variant => {
    
    // Agrupar por cor
    if (!variantsByColor[variant.color]) {
        variantsByColor[variant.color] = [];
    }
    variantsByColor[variant.color].push(variant);
});

// Ordenar tamanhos dentro de cada cor
const sizeOrder = { 'P': 1, 'M': 2, 'G': 3, 'GG': 4 };

// Ordem das cores padrão
const colorOrder = ['Preto', 'Azul Marinho', 'Cinza', 'Marrom'];

// Ordenar cores (padrão primeiro, depois alfabético)
const sortedColors = Object.keys(variantsByColor).sort((a, b) => {
    const indexA = colorOrder.indexOf(a);
    const indexB = colorOrder.indexOf(b);
    
    if (indexA !== -1 && indexB !== -1) return indexA - indexB;
    if (indexA !== -1) return -1;
    if (indexB !== -1) return 1;
    return a.localeCompare(b);
});

// Renderizar organizados por cor
sortedColors.forEach(color => {
    // Ordenar tamanhos dentro da cor
    variantsByColor[color].sort((a, b) => sizeOrder[a.size] - sizeOrder[b.size]);
    
    variantsByColor[color].forEach(variant => {
        const syncHint = variant.exists ? '' : '<small style="display: block; margin-top: 0.35rem; color: #856404;">Nova variante: sera criada ao salvar</small>';
        html += `
            <div class="variant-card ${!variant.available ? 'unavailable' : ''}">
                <div class="variant-header">
                    <span class="variant-label">${escapeHTML(variant.size)} - ${escapeHTML(variant.color)}</span>
                </div>
                <input type="number" class="stock-input"
                       value="${Number(variant.stock || 0)}"
                       min="0"
                       data-variant-id="${escapeAttribute(variant.id)}"
                       placeholder="Quantidade">
                <label class="toggle-available">
                    <input type="checkbox"
                           ${variant.available ? 'checked' : ''}
                           data-variant-id="${escapeAttribute(variant.id)}">
                    Disponível para venda
                </label>
                <small style="display: block; margin-top: 0.5rem; color: #999;">SKU: ${escapeHTML(variant.sku)}</small>
                ${syncHint}
            </div>
        `;
    });
});
                
                html += '</div>';
                document.getElementById('variantsContainer').innerHTML = html;
                document.getElementById('stockModal').classList.add('active');
                
            } catch (error) {
                console.error('Erro ao abrir modal:', error);
                alert('Erro ao carregar variantes do produto');
            }
        }
        
        function closeStockModal() {
            document.getElementById('stockModal').classList.remove('active');
            currentProduct = null;
            currentVariants = [];
        }
        
        async function saveStock() {
            if (!currentProduct) return;
            
            try {
                const stockInputs = document.querySelectorAll('.stock-input');
                const availableInputs = document.querySelectorAll('.toggle-available input');
                const availabilityByVariantId = new Map(
                    Array.from(availableInputs).map(input => [input.dataset.variantId, input.checked])
                );
                
                let totalStock = 0;
                const batch = db.batch();
                
                stockInputs.forEach(input => {
                    const variantId = input.dataset.variantId;
                    const stock = parseInt(input.value) || 0;
                    const available = availabilityByVariantId.get(variantId) === true;
                    const variant = currentVariants.find(item => item.id === variantId);
                    const size = normalizeText(variant?.size);
                    const color = normalizeText(variant?.color);

                    if (!size || !color) return;
                    
                    totalStock += stock;
                    
                    const variantRef = db.collection('produtos')
                        .doc(currentProduct.id)
                        .collection('variants')
                        .doc(variantId);

                    const variantData = {
                        size,
                        color,
                        stock,
                        available,
                        sku: normalizeText(variant?.sku, buildVariantSku(currentProduct.id, size, color)),
                        price: normalizeNumber(variant?.price, currentProduct.price || 0),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    };

                    if (!variant?.exists) {
                        variantData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    }

                    batch.set(variantRef, variantData, { merge: true });
                });
                
                const productRef = db.collection('produtos').doc(currentProduct.id);
                batch.update(productRef, {
                    totalStock: totalStock,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                await batch.commit();
                
                alert('✅ Estoque atualizado com sucesso!');
                closeStockModal();
                loadProducts();
                loadStockControl();
                loadDashboard();
                
            } catch (error) {
                console.error('Erro ao salvar estoque:', error);
                alert('❌ Erro ao salvar estoque: ' + error.message);
            }
        }
        
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const adminDoc = await db.collection('admins').doc(user.uid).get();
                if (adminDoc.exists && adminDoc.data().role === 'admin') {
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('adminDashboard').style.display = 'flex';
                    loadDashboard();
                }
            }
        });
    </script>
</body>
</html>
